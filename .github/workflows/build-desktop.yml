name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86
            runs-on: ubuntu-24.04
            args: ""
            cli_archive: tetorica-mdrop-linux-x86.tar.gz

          - platform: linux-arm
            runs-on: ubuntu-24.04-arm
            args: ""
            cli_archive: tetorica-mdrop-linux-arm.tar.gz

          - platform: windows
            runs-on: windows-latest
            args: ""
            cli_archive: tetorica-mdrop-windows-x86_64.zip

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CLI
        shell: bash
        run: |
          cargo build --release -p tetorica-mdrop-cli

      - name: Package CLI
        shell: bash
        run: |
          mkdir -p dist-cli

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/tetorica-mdrop.exe dist-cli/
            cd dist-cli
            7z a "../${{ matrix.cli_archive }}" *
          else
            cp target/release/tetorica-mdrop dist-cli/
            tar -czf "${{ matrix.cli_archive }}" -C dist-cli .
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli_archive }}
          path: ${{ matrix.cli_archive }}

      - name: Upload CLI artifact to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ matrix.cli_archive }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "mDrop ${{ github.ref_name }}"
          releaseBody: "mDrop desktop build"
          releaseDraft: true
          prerelease: false