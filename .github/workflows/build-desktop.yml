name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86
            runs-on: ubuntu-24.04
            args: ""
            cli_archive: tetorica-mdrop-linux-x86.tar.gz

          - platform: linux-arm
            runs-on: ubuntu-24.04-arm
            args: ""
            cli_archive: tetorica-mdrop-linux-arm.tar.gz

          - platform: macos-apple-silicon
            runs-on: macos-latest
            args: "--target aarch64-apple-darwin"
            cli_archive: tetorica-mdrop-macos-aarch64.tar.gz

          - platform: macos-intel
            runs-on: macos-13
            args: "--target x86_64-apple-darwin"
            cli_archive: tetorica-mdrop-macos-x86_64.tar.gz

          - platform: windows
            runs-on: windows-latest
            args: ""
            cli_archive: tetorica-mdrop-windows-x86_64.zip

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos-apple-silicon') && 'aarch64-apple-darwin' || contains(matrix.platform, 'macos-intel') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CLI
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos-apple-silicon" ]]; then
            cargo build --release -p tetorica-mdrop-cli --target aarch64-apple-darwin
          elif [[ "${{ matrix.platform }}" == "macos-intel" ]]; then
            cargo build --release -p tetorica-mdrop-cli --target x86_64-apple-darwin
          else
            cargo build --release -p tetorica-mdrop-cli
          fi

      - name: Package CLI
        shell: bash
        run: |
          mkdir -p dist-cli

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/tetorica-mdrop.exe dist-cli/
            cd dist-cli
            7z a "../${{ matrix.cli_archive }}" *
          elif [[ "${{ matrix.platform }}" == "macos-apple-silicon" ]]; then
            cp target/aarch64-apple-darwin/release/tetorica-mdrop dist-cli/
            tar -czf "${{ matrix.cli_archive }}" -C dist-cli .
          elif [[ "${{ matrix.platform }}" == "macos-intel" ]]; then
            cp target/x86_64-apple-darwin/release/tetorica-mdrop dist-cli/
            tar -czf "${{ matrix.cli_archive }}" -C dist-cli .
          else
            cp target/release/tetorica-mdrop dist-cli/
            tar -czf "${{ matrix.cli_archive }}" -C dist-cli .
          fi

      - name: Upload CLI artifact to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ matrix.cli_archive }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "mDrop ${{ github.ref_name }}"
          releaseBody: "mDrop desktop build"
          releaseDraft: true
          prerelease: false
